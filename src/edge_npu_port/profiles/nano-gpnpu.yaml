name: nano-gpnpu
kind: programmable-npu
description: >
  A single small "Nano-class" general-purpose NPU core, modeled on publicly documented
  GPNPU architectures (Quadric Chimera): a 2D array of processing elements (PEs), each
  with int8 MACs, a 32-bit ALU and local memory, fed by DMA from a shared L2.
  This is NOT a vendor spec -- see `assumptions`.

compute:
  macs_per_cycle: 512        # 64 PEs x 8 int8 MACs
  vector_ops_per_cycle: 64   # one 32-bit ALU op per PE per cycle
  clock_hz: 1.0e9

memory:
  onchip_bytes: 1048576      # 1 MB L2
  num_pes: 64
  local_bytes_per_pe: 4096   # 4 KB
  ddr_bytes_per_s: 16.0e9

bytes_per_elem: 1            # int8 activations and weights

op_support:
  # Programmable core: anything can run, but ops not listed need a hand-written kernel.
  default: custom
  matrix: [Conv, ConvTranspose, MatMul, Gemm]
  vector: [Add, Sub, Mul, Div, Sigmoid, Relu, LeakyRelu, Clip, HardSigmoid, HardSwish, Tanh,
           MaxPool, AveragePool, GlobalAveragePool, Resize, Softmax, Exp, ReduceMean, ReduceMax,
           Pow, Sqrt, Erf, Neg, Abs, Min, Max]
  layout: [Concat, Split, Reshape, Transpose, Slice, Flatten, Squeeze, Unsqueeze, Identity,
           Gather, Pad, Expand, Tile, Cast, Shape]

assumptions:
  - field: memory.local_bytes_per_pe
    value: 4 KB
    note: per-PE local memory size is not published
  - field: memory.ddr_bytes_per_s
    value: 16 GB/s
    note: taken from Quadric's QB4 Llama2 demo configuration; actual DDR is set by the SoC integrator
  - field: compute.vector_ops_per_cycle
    value: 64
    note: assumes one ALU op per PE per cycle; real SIMD width per ALU is not published
  - field: op_support
    value: matrix/vector/layout split
    note: our own classification of which ops map to MACs vs ALUs; the vendor compiler may differ

sources:
  - https://quadric.ai/architecture
  - https://www.businesswire.com/news/home/20240716802154/en
  - https://www.businesswire.com/news/home/20230914529268/en
